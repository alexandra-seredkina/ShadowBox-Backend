server {
    listen 80;
    listen [::]:80;
    server_name shadow-security.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shadow-security.xyz;

    ssl_certificate /etc/letsencrypt/live/shadow-security.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shadow-security.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Без preload и includeSubDomains: их сложно откатить, включим после стабильного прода
    more_set_headers "Strict-Transport-Security: max-age=31536000";

    include /etc/nginx/snippets/locations.conf;
}
