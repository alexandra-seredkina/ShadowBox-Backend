load_module modules/ngx_http_headers_more_filter_module.so;

user nginx;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # IP адреса в логи не пишем
    log_format private '[$time_local] "$request" $status $body_bytes_sent $request_time';
    access_log /dev/stdout private;

    server_tokens off;

    # Маскировка под IIS с PHP, чтобы сбить с толку автоматические сканеры.
    # more_set_headers заменяет заголовок, add_header добавил бы второй.
    more_set_headers "Server: Microsoft-IIS/10.0";
    more_set_headers "X-Powered-By: PHP/7.4.6";

    # В отличие от add_header, more_set_headers наследуется во все location
    # и применяется к ответам с любым статусом.
    more_set_headers "X-Content-Type-Options: nosniff";
    # Устаревший XSS-фильтр браузеров сам создавал уязвимости, поэтому выключаем
    more_set_headers "X-XSS-Protection: 0";
    more_set_headers "X-Frame-Options: DENY";
    more_set_headers "Referrer-Policy: no-referrer";
    more_set_headers "X-Permitted-Cross-Domain-Policies: none";
    more_set_headers "Permissions-Policy: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), clipboard-read=(), clipboard-write=(self), fullscreen=(self)";
    more_set_headers "Cross-Origin-Opener-Policy: same-origin";
    more_set_headers "Cross-Origin-Resource-Policy: same-origin";
    # Content-Security-Policy для страниц выставляет фронтенд (nonce для скриптов Next.js)

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/sites/*.conf;
}
