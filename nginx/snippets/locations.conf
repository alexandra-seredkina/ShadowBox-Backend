limit_conn addr 20;

# Default error pages give nginx away, answer without a signature
error_page 429 500 502 503 504 @error;
location @error {
    default_type text/plain;
    return 500 "Error";
}

location /api/ {
    limit_req zone=api burst=20 nodelay;
    more_set_headers "Content-Security-Policy: default-src 'none'; frame-ancestors 'none'";
    proxy_pass http://backend:3000;
    include /etc/nginx/snippets/proxy.conf;
}

# Empty responses for the decoy scripts in the frontend layout.tsx
location /nonexistent/ {
    default_type application/javascript;
    return 200 "";
}

location / {
    limit_req zone=web burst=100 nodelay;
    proxy_pass http://frontend:3000;
    include /etc/nginx/snippets/proxy.conf;
}
