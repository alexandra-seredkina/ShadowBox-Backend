proxy_http_version 1.1;
# nosemgrep: request-host-used -- in production default_server drops an unknown Host
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# nginx is the edge: replace whatever the client sent with the address it
# connected from. The backend hashes it for rate limits and session binding
# and trusts this header only from nginx (TRUSTED_PROXIES).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP "";
