name: shadowbox

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: &backend-build
      context: .
      dockerfile: Dockerfile.dev
    environment: &backend-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      ALLOWED_ORIGINS: http://localhost:${HTTP_PORT:-8080},http://127.0.0.1:${HTTP_PORT:-8080}
      PRELOGIN_SALT_KEY: ${PRELOGIN_SALT_KEY:?set PRELOGIN_SALT_KEY in .env}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-shadowbox.test}
      IP_HASH_KEY: ${IP_HASH_KEY:?set IP_HASH_KEY in .env}
      IP_HASH_KEY_VERSION: ${IP_HASH_KEY_VERSION:-1}
      IP_HASH_PREVIOUS_KEY: ${IP_HASH_PREVIOUS_KEY:-}
      # Only nginx may tell the backend who the client is
      TRUSTED_PROXIES: 172.28.10.10
    volumes: &backend-volumes
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30

  # Scheduled jobs (alias expiry, later clean-ups). Starts once the backend has
  # generated the Prisma client and applied the migrations.
  worker:
    build: *backend-build
    environment: *backend-env
    volumes: *backend-volumes
    command: ['npm', 'run', 'start:worker']
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../ShadowBox-Frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ../ShadowBox-Frontend:/app
      - /app/node_modules
      - /app/.next

  nginx:
    build: ./nginx
    networks:
      default:
        ipv4_address: 172.28.10.10
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx/sites/dev.conf:/etc/nginx/sites/default.conf:ro
    depends_on:
      - backend
      - frontend

networks:
  default:
    ipam:
      config:
        # Fixed so the backend can trust exactly the nginx address above
        - subnet: 172.28.10.0/24

volumes:
  db_data:
